<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busca de Comércios</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --bg: #eef2ff;
      --white: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #e5e7eb;
      --success: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      color: var(--primary-dark);
    }

    .header p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .panel {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.1);
      padding: 24px;
      margin-bottom: 24px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto;
      gap: 16px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 700;
      color: var(--text);
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 1rem;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .quick-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .chip {
      background: #f3f4f6;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .chip.active,
    .chip:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .tag {
      display: inline-block;
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary-dark);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1.25rem;
    }

    .card p {
      margin: 6px 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .empty {
      background: white;
      border-radius: 14px;
      padding: 30px 20px;
      text-align: center;
      color: var(--muted);
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.08);
    }

    .badge-count {
      margin-top: 12px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Busca de Comércios</h1>
      <p>Encontre comércios por cidade e categoria</p>
    </div>

    <div class="panel">
      <div class="filters">
        <div class="field">
          <label for="cidade">Cidade</label>
          <input id="cidade" type="text" placeholder="Digite a cidade" />
        </div>

        <div class="field">
          <label for="categoria">Categoria</label>
          <select id="categoria">
            <option value="">Todas</option>
            <option value="restaurante">Restaurante</option>
            <option value="bar">Bar</option>
            <option value="padaria">Padaria</option>
            <option value="mercado">Mercado</option>
            <option value="farmacia">Farmácia</option>
            <option value="salao">Salão</option>
            <option value="oficina">Oficina</option>
          </select>
        </div>

        <div class="field">
          <label for="ordenar">Ordenar</label>
          <select id="ordenar">
            <option value="relevancia">Relevância</option>
            <option value="nome">Nome (A-Z)</option>
          </select>
        </div>

        <button class="btn" id="buscarBtn">Buscar</button>
      </div>

      <div class="quick-filters">
        <button class="chip" data-categoria="restaurante">🍽️ Restaurante</button>
        <button class="chip" data-categoria="mercado">🛒 Mercado</button>
        <button class="chip" data-categoria="farmacia">💊 Farmácia</button>
        <button class="chip" data-categoria="salao">💇 Salão</button>
        <button class="chip" data-categoria="oficina">🔧 Oficina</button>
      </div>
    </div>

    <div id="resultado"></div>
  </div>

  <script>
    const comercios = {
      'sao paulo': [
        { nome: 'Pizza Bella Italia', categoria: 'restaurante', endereco: 'Rua Augusta, 1000', telefone: '(11) 3333-1111' },
        { nome: 'Padaria Pão Quente', categoria: 'padaria', endereco: 'Rua das Flores, 250', telefone: '(11) 3333-3333' },
        { nome: 'Mercado Central', categoria: 'mercado', endereco: 'Avenida Brasil, 2000', telefone: '(11) 3333-4444' },
        { nome: 'Farmácia Saúde+', categoria: 'farmacia', endereco: 'Rua Oscar Freire, 150', telefone: '(11) 3333-5555' },
        { nome: 'Studio Beleza', categoria: 'salao', endereco: 'Rua Bandeira, 300', telefone: '(11) 3333-6666' }
      ],
      'rio de janeiro': [
        { nome: 'Churrascaria Carioca', categoria: 'restaurante', endereco: 'Avenida Atlântica, 1500', telefone: '(21) 2222-1111' },
        { nome: 'Bar da Praia', categoria: 'bar', endereco: 'Praia de Copacabana, 0', telefone: '(21) 2222-2222' },
        { nome: 'Mercadinho do Bairro', categoria: 'mercado', endereco: 'Rua das Acácias, 200', telefone: '(21) 2222-4444' }
      ],
      'belo horizonte': [
        { nome: 'Restaurante Mineiro', categoria: 'restaurante', endereco: 'Avenida Getúlio Vargas, 3000', telefone: '(31) 4444-1111' },
        { nome: 'Pão Caseiro', categoria: 'padaria', endereco: 'Avenida Brasil, 1200', telefone: '(31) 4444-3333' },
        { nome: 'Mercado BH', categoria: 'mercado', endereco: 'Avenida Afonso Pena, 900', telefone: '(31) 4444-4444' }
      ],
      'brasilia': [
        { nome: 'Comida de Corte', categoria: 'restaurante', endereco: 'Setor Comercial Norte', telefone: '(61) 5555-1111' },
        { nome: 'Padaria do Centro', categoria: 'padaria', endereco: 'Setor Comercial Central', telefone: '(61) 5555-3333' },
        { nome: 'Farmácia Central', categoria: 'farmacia', endereco: 'Setor Comercial Sul', telefone: '(61) 5555-5555' }
      ],
      'salvador': [
        { nome: 'Restaurante Baiano', categoria: 'restaurante', endereco: 'Rua Chile, 200', telefone: '(71) 6666-1111' },
        { nome: 'Bar da Baía', categoria: 'bar', endereco: 'Pelourinho, 100', telefone: '(71) 6666-2222' } 
      ]
    };

    function normalizar(texto) {
      return (texto || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function renderizar(lista, cidade) {
      const container = document.getElementById('resultado');

      if (!lista.length) {
        container.innerHTML = `
          <div class="empty">
            <h3>Nenhum comércio encontrado</h3>
            <p>Não encontramos resultados para <strong>${cidade}</strong> com os filtros atuais.</p>
          </div>
        `;
        return;
      }

      const cards = lista.map(item => `
        <div class="card">
          <div class="tag">${item.categoria}</div>
          <h3>${item.nome}</h3>
          <p><strong>📍</strong> ${item.endereco}</p>
          <p><strong>📞</strong> ${item.telefone}</p>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="badge-count">Encontrados ${lista.length} comércios em ${cidade}</div>
        <div class="results">${cards}</div>
      `;
    }

    function buscar() {
      const cidadeInput = document.getElementById('cidade').value;
      const categoria = document.getElementById('categoria').value;
      const ordenar = document.getElementById('ordenar').value;

      const chaveCidade = normalizar(cidadeInput);

      if (!chaveCidade) {
        alert('Digite uma cidade para buscar.');
        return;
      }

      const cidadeEncontrada = Object.keys(comercios).find(cidade => normalizar(cidade) === chaveCidade);

      if (!cidadeEncontrada) {
        renderizar([], cidadeInput || 'a cidade informada');
        return;
      }

      let lista = [...comercios[cidadeEncontrada]];

      if (categoria) {
        lista = lista.filter(item => item.categoria === categoria);
      }

      if (ordenar === 'nome') {
        lista.sort((a, b) => a.nome.localeCompare(b.nome));
      }

      renderizar(lista, cidadeEncontrada);
    }

    document.getElementById('buscarBtn').addEventListener('click', buscar);

    document.getElementById('cidade').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') buscar();
    });

    document.querySelectorAll('.chip').forEach(button => {
      button.addEventListener('click', function() {
        const categoria = this.dataset.categoria;
        document.getElementById('categoria').value = categoria;

        document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
        this.classList.add('active');

        const cidadeAtual = document.getElementById('cidade').value.trim();
        if (cidadeAtual) {
          buscar();
        }
      });
    });

    document.getElementById('resultado').innerHTML = `
      <div class="empty">
        <h3>Pronto para buscar</h3>
        <p>Digite uma cidade, escolha uma categoria e clique em <strong>Buscar</strong>.</p>
      </div>
    `;
  </script>
</body>
</html>
