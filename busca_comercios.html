<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Comércios Locais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 20px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95em;
        }

        input, select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .commerce-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .commerce-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .commerce-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .commerce-card p {
            color: #666;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .commerce-card strong {
            color: #333;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 10px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.1em;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .filter-btn {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stats {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 0.95em;
        }

        @media (max-width: 768px) {
            .search-container {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏪 Busca de Comércios Locais</h1>
            <p>Encontre estabelecimentos próximos a você - Sem necessidade de site próprio</p>
        </header>

        <div class="search-box">
            <div class="search-container">
                <div class="form-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Digite o nome da cidade..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria">
                        <option value="">Todas as categorias</option>
                        <option value="restaurante">Restaurante</option>
                        <option value="bar">Bar</option>
                        <option value="padaria">Padaria</option>
                        <option value="mercado">Mercado</option>
                        <option value="farmacia">Farmácia</option>
                        <option value="salao">Salão de Beleza</option>
                        <option value="loja">Loja de Roupas</option>
                        <option value="eletronico">Eletrônicos</option>
                        <option value="oficina">Oficina Mecânica</option>
                        <option value="consultorio">Consultório</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ordenar">Ordenar por</label>
                    <select id="ordenar">
                        <option value="relevancia">Relevância</option>
                        <option value="nome">Nome (A-Z)</option>
                        <option value="recente">Mais Recente</option>
                    </select>
                </div>
                <button onclick="buscar()">🔍 Buscar</button>
            </div>

            <div class="filters">
                <button class="filter-btn" onclick="filtroRapido('restaurante')">🍽️ Restaurante</button>
                <button class="filter-btn" onclick="filtroRapido('mercado')">🛒 Mercado</button>
                <button class="filter-btn" onclick="filtroRapido('farmacia')">💊 Farmácia</button>
                <button class="filter-btn" onclick="filtroRapido('salao')">💇 Salão</button>
                <button class="filter-btn" onclick="filtroRapido('oficina')">🔧 Oficina</button>
            </div>
        </div>

        <div id="resultados"></div>
    </div>

    <script>
        // Base de dados de comércios por cidade
        const comerciosDB = {
            'são paulo': [
                { nome: 'Pizza Bella Italia', categoria: 'restaurante', endereco: 'Rua Augusta, 1000', telefone: '(11) 3333-1111', email: 'contato@pizzabella.com' },
                { nome: 'Boteco do João', categoria: 'bar', endereco: 'Avenida Paulista, 500', telefone: '(11) 3333-2222', email: 'boteco@joao.com' },
                { nome: 'Padaria Pão Quente', categoria: 'padaria', endereco: 'Rua das Flores, 250', telefone: '(11) 3333-3333', email: 'contato@paoquente.com' },
                { nome: 'Mercado Central', categoria: 'mercado', endereco: 'Avenida Brasil, 2000', telefone: '(11) 3333-4444', email: 'central@mercado.com' },
                { nome: 'Farmácia Saúde+', categoria: 'farmacia', endereco: 'Rua Oscar Freire, 150', telefone: '(11) 3333-5555', email: 'saude@farmacia.com' },
                { nome: 'Studio Beleza', categoria: 'salao', endereco: 'Rua Bandeira, 300', telefone: '(11) 3333-6666', email: 'studio@beleza.com' },
                { nome: 'Oficina do Carlos', categoria: 'oficina', endereco: 'Avenida Imigrantes, 5000', telefone: '(11) 3333-7777', email: 'carlos@oficina.com' }
            ],
            'rio de janeiro': [
                { nome: 'Churrascaria Carioca', categoria: 'restaurante', endereco: 'Avenida Atlantica, 1500', telefone: '(21) 2222-1111', email: 'churrascaria@carioca.com' },
                { nome: 'Bar da Praia', categoria: 'bar', endereco: 'Praia de Copacabana, 0', telefone: '(21) 2222-2222', email: 'bar@praia.com' },
                { nome: 'Padaria Carioca', categoria: 'padaria', endereco: 'Rua Visconde, 400', telefone: '(21) 2222-3333', email: 'padaria@carioca.com' },
                { nome: 'Mercadinho do Bairro', categoria: 'mercado', endereco: 'Rua das Acácias, 200', telefone: '(21) 2222-4444', email: 'mercadinho@bairro.com' },
                { nome: 'Farmácia Boa Saúde', categoria: 'farmacia', endereco: 'Avenida Rio Branco, 800', telefone: '(21) 2222-5555', email: 'boasaude@farmacia.com' }
            ],
            'belo horizonte': [
                { nome: 'Restaurante Mineiro', categoria: 'restaurante', endereco: 'Avenida Getúlio Vargas, 3000', telefone: '(31) 4444-1111', email: 'mineiro@restaurante.com' },
                { nome: 'Boteco Mineirão', categoria: 'bar', endereco: 'Rua Espírito Santo, 600', telefone: '(31) 4444-2222', email: 'boteco@mineirão.com' },
                { nome: 'Pão Caseiro', categoria: 'padaria', endereco: 'Avenida Brasil, 1200', telefone: '(31) 4444-3333', email: 'paocaseiro@padaria.com' },
                { nome: 'Mercado BH', categoria: 'mercado', endereco: 'Avenida Afonso Pena, 900', telefone: '(31) 4444-4444', email: 'mercado@bh.com' }
            ],
            'brasília': [
                { nome: 'Comida de Corte', categoria: 'restaurante', endereco: 'Setor Comercial Norte, Bloco A', telefone: '(61) 5555-1111', email: 'comida@corte.com' },
                { nome: 'Bar Brasiliense', categoria: 'bar', endereco: 'Asa Sul, Bloco B', telefone: '(61) 5555-2222', email: 'bar@brasiliense.com' },
                { nome: 'Padaria do Centro', categoria: 'padaria', endereco: 'Setor Comercial Central, 102', telefone: '(61) 5555-3333', email: 'padaria@centro.com' },
                { nome: 'Mercado Brasília', categoria: 'mercado', endereco: 'Asa Norte, Bloco C', telefone: '(61) 5555-4444', email: 'mercado@brasilia.com' },
                { nome: 'Farmácia Central', categoria: 'farmacia', endereco: 'Setor Comercial Sul', telefone: '(61) 5555-5555', email: 'farmacia@central.com' }
            ],
            'salvador': [
                { nome: 'Restaurante Baiano', categoria: 'restaurante', endereco: 'Rua Chile, 200', telefone: '(71) 6666-1111', email: 'baiano@restaurante.com' },
                { nome: 'Bar da Baia', categoria: 'bar', endereco: 'Pelourinho, 100', telefone: '(71) 6666-2222', email: 'bar@baia.com' },
                { nome: 'Padaria da Bahia', categoria: 'padaria', endereco: 'Avenida Sete de Setembro, 500', telefone: '(71) 6666-3333', email: 'padaria@bahia.com' }
            ]
        };

        let filtroAtivo = null;
        let resultadosAtuais = [];

        function buscar() {
            const cidade = document.getElementById('cidade').value.toLowerCase().trim();
            const categoria = document.getElementById('categoria').value;
            const ordenar = document.getElementById('ordenar').value;

            if (!cidade) {
                alert('Por favor, digite uma cidade!');
                return;
            }

            let comercios = comerciosDB[cidade] || [];

            if (categoria) {
                comercios = comercios.filter(c => c.categoria === categoria);
            }

            // Ordenação
            if (ordenar === 'nome') {
                comercios.sort((a, b) => a.nome.localeCompare(b.nome));
            } else if (ordenar === 'recente') {
                comercios.reverse();
            }

            resultadosAtuais = comercios;
            exibirResultados(comercios, cidade);
            document.getElementById('cidade').value = '';
        }

        function filtroRapido(categoria) {
            document.getElementById('categoria').value = categoria;
            
            // Ativar/desativar botão de filtro
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function exibirResultados(comercios, cidade) {
            const container = document.getElementById('resultados');

            if (comercios.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        ❌ Nenhum comércio encontrado em <strong>${cidade}</strong>
                        <p style="margin-top: 10px; font-size: 0.9em;">Tente outra cidade ou categoria</p>
                    </div>
                `;
                return;
            }

            let html = `<div class="stats">Encontrados ${comercios.length} comércio(s) em ${cidade}</div>`;
            html += '<div class="results">';

            comercios.forEach(comercio => {
                html += `
                    <div class="commerce-card">
                        <span class="badge">${comercio.categoria}</span>
                        <h3>${comercio.nome}</h3>
                        <p><strong>📍 Endereço:</strong> ${comercio.endereco}</p>
                        <p><strong>📞 Telefone:</strong> ${comercio.telefone}</p>
                        <p><strong>📧 Email:</strong> <a href="mailto:${comercio.email}" style="color: #667eea;">${comercio.email}</a></p>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // Buscar ao pressionar Enter
        document.getElementById('cidade').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                buscar();
            }
        });

        // Sugerir cidades ao digitar
        document.getElementById('cidade').addEventListener('input', function() {
            const valor = this.value.toLowerCase();
            const cidades = Object.keys(comerciosDB);
            const sugestoes = cidades.filter(c => c.includes(valor));
            
            if (valor && sugestoes.length > 0) {
                console.log('Sugestões:', sugestoes);
            }
        });

        // Mensagem inicial
        window.addEventListener('load', function() {
            document.getElementById('resultados').innerHTML = `
                <div class="no-results">
                    👋 Bem-vindo! Digite uma cidade e clique em buscar
                    <p style="margin-top: 10px; font-size: 0.9em;">Cidades disponíveis: São Paulo, Rio de Janeiro, Belo Horizonte, Brasília, Salvador</p>
                </div>
            `;
        });
    </script>
</body>
</html>
